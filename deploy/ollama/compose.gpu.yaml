# deploy/ollama/compose.yaml's Ollama on an NVIDIA GPU (ADR-0041, ADR-0050):
#
#   docker compose -f deploy/ollama/compose.yaml -f deploy/ollama/compose.gpu.yaml up -d
#
# Docker reaches the GPU on Linux with the NVIDIA driver and the NVIDIA Container Toolkit, and on Windows through WSL2
# with the NVIDIA driver; a Hyper-V VM only with the GPU passed through to it. Check:
#   docker run --rm --gpus all ollama/ollama:0.40.1 nvidia-smi -L

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
