# Centerline on one Docker host (SDD §3, ADR-0030): seven containers. The local AI isn't one of them: the api asks
# the Ollama that deploy/.env's CENTERLINE_OLLAMA_URL names, a container of its own, here or on another machine
# (ADR-0050; deploy/ollama/ runs one where none does yet).
#
#   deploy/setup.sh                 # once: this host's settings in deploy/config, and deploy/.env
#   deploy/compose.sh up -d --build # then http://localhost:6040 (https:// with CENTERLINE_SCHEME=https)
#
# It judges the real machine on the plant broker and reads the real Timebase, as the control-room PC will, on its
# own database. Everything it writes is permanent. One monitor-core judges the line at a time: stop the development
# services before starting this one (deploy/README.md).

name: centerline

# Each container's log, rotated: at most 3 files of 10 MB, so diagnostic logs can't fill the disk (RES-02, ADR-0036)
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-python: &python
  image: centerline-services:latest
  logging: *logging
  build:
    context: ..
    dockerfile: deploy/services.Dockerfile
    args:
      UID: ${CENTERLINE_UID:-1000}  # the owner of deploy/config on this host (deploy/.env)
  restart: unless-stopped
  networks: [centerline]

services:
  postgres:
    image: pgvector/pgvector:pg17
    logging: *logging
    environment:
      POSTGRES_DB: centerline
      POSTGRES_USER: centerline
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      TZ: UTC
    secrets: [postgres-password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centerline -d centerline"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [centerline]  # not published: only the services reach it

  api:
    <<: *python
    command: ["uvicorn", "centerline_api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--no-proxy-headers"]
    environment:
      CENTERLINE_API_CONFIG: /app/config/api.json
      CENTERLINE_SCHEME: ${CENTERLINE_SCHEME:-http}  # over plain HTTP the session cookie can't be Secure (ADR-0032)
      CENTERLINE_OLLAMA_URL: ${CENTERLINE_OLLAMA_URL:-}  # the Ollama to ask (ADR-0050): deploy/.env; empty, api.json's ai.url
    extra_hosts:
      - "host.docker.internal:host-gateway"  # an Ollama published on this host, on Linux as on Docker Desktop
    volumes:
      - ./config:/app/config  # it saves the connections, the register's export and the query log here
      - ${CENTERLINE_BACKUP_DIR:-./backups}:/app/backups:ro  # the backup agent's status.json, for the health page (ADR-0038)
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  monitor-core:
    <<: *python
    command: ["python", "-m", "centerline_monitor"]
    hostname: centerline-docker  # its MQTT client ID: centerline-monitor-centerline-docker
    environment:
      CENTERLINE_MONITOR_CONFIG: /app/config/monitor-core.json
    volumes:
      - ./config:/app/config:ro
      - journal:/app/data/journal  # steps not yet in the database (RES-01)
    depends_on:
      api: {condition: service_healthy}  # the api migrates the database first

  notifier:
    <<: *python
    command: ["python", "-m", "centerline_notifier"]
    hostname: centerline-docker
    environment:
      CENTERLINE_NOTIFIER_CONFIG: /app/config/notifier.json
    volumes:
      - ./config:/app/config:ro
    depends_on:
      api: {condition: service_healthy}

  backup:  # BKP-01/02 (ADR-0035): a set every hour, kept 48 h, the newest of 30 days and of 12 months, here and off-host
    <<: *python
    command: ["python", "-m", "centerline_backup"]
    environment:
      CENTERLINE_BACKUP_CONFIG: /app/config/backup.json
      CENTERLINE_OFFHOST: ${CENTERLINE_BACKUP_OFFHOST:+/offhost}  # empty unless deploy/.env names an off-host folder
    volumes:
      - ./config:/app/config:ro  # each set carries these settings and secrets, for a restore on another PC
      - ${CENTERLINE_BACKUP_DIR:-./backups}:/backups  # a folder on the host: it outlives the stack's volumes
      - ${CENTERLINE_BACKUP_OFFHOST:-./backups/no-offhost}:/offhost
    depends_on:
      api: {condition: service_healthy}  # the api migrates the database first

  clamav:  # scans every uploaded OCAP and guidance file before it's kept (SEC-01, ADR-0031)
    image: clamav/clamav:stable
    logging: *logging
    volumes:
      - clamav-db:/var/lib/clamav  # its signatures, kept between restarts; freshclam updates them (O-24 offline)
    restart: unless-stopped
    networks: [centerline]  # not published: only the api reaches it, as clamav:3310
    # Its own healthcheck (clamdcheck.sh). The first start downloads the signatures and loads them in a few minutes;
    # meanwhile uploads are refused with "the malware scanner isn't answering". Nothing waits for it.

  proxy:
    image: centerline-web:latest
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      CENTERLINE_SCHEME: ${CENTERLINE_SCHEME:-http}  # http (ADR-0032) or https (deploy/.env)
      CENTERLINE_SITE: ${CENTERLINE_SITE:-localhost}  # HTTPS only: the names browsers use, for the certificate
      CENTERLINE_DEFAULT_SNI: ${CENTERLINE_DEFAULT_SNI:-localhost}  # HTTPS only: for browsers that open it by IP address
    ports:
      - "${CENTERLINE_BIND:-127.0.0.1}:${CENTERLINE_PORT:-6040}:8080"  # this PC only unless deploy/.env opens it
    volumes:
      - caddy-data:/data  # HTTPS: its local CA and certificate
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    networks: [centerline]  # the api trusts its X-Forwarded-For by its name, "proxy" (auth.trusted_proxies)

networks:
  centerline:  # Docker picks a free address range on each host

volumes:
  pgdata:
  journal:
  clamav-db:
  caddy-data:
  caddy-config:

secrets:
  postgres-password:
    file: ./config/secrets/postgres-password
