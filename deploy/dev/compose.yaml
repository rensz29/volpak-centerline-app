# Centerline development database (ADR-0012). Not the production stack.
#
#   docker compose -f deploy/dev/compose.yaml up -d
#
# The password is generated once into config/secrets/postgres-password (see README.md).
name: centerline-dev

services:
  postgres:
    image: pgvector/pgvector:pg17  # the SDD's database: PostgreSQL 17 with pgvector
    environment:
      POSTGRES_DB: centerline
      POSTGRES_USER: centerline
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      TZ: UTC
    secrets:
      - postgres-password
    ports:
      - "127.0.0.1:55432:5432"  # 5432 is taken on this PC; loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centerline -d centerline"]
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  postgres-password:
    file: ../../config/secrets/postgres-password

volumes:
  pgdata:
