[project]
name = "centerline-services"
version = "0.1.0"
description = "Centerline Monitoring & OCAP Assistance: backend services (api, monitor-core, notifier; shared code)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "pydantic>=2.7",
  "paho-mqtt>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[tool.pytest.ini_options]
pythonpath = ["common", "api", "monitor_core", "notifier"]
testpaths = ["api/tests", "monitor_core/tests", "notifier/tests"]
addopts = "-q"
