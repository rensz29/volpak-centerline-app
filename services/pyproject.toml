[project]
name = "centerline-services"
version = "0.1.0"
description = "Centerline Monitoring & OCAP Assistance: backend services (api, monitor-core, notifier; shared code)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "pydantic>=2.7",
  "paho-mqtt>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "pdfplumber>=0.11,<0.12",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2", "fpdf2>=2.8,<3"]

[tool.pytest.ini_options]
pythonpath = ["common", "api", "monitor_core", "notifier"]
testpaths = ["api/tests", "monitor_core/tests", "notifier/tests", "../tests/acceptance"]
markers = ["urs(*ids): the URS v1.1 requirements an acceptance test shows (tests/acceptance)"]
addopts = "-q"
